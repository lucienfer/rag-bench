[project]
name = "rag-bench"
version = "0.1.0"
description = "A lightweight RAG retrieval evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
rag-bench = "rag_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
